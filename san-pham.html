<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm — Vườn &amp; Nắng</title>
<meta name="description" content="Thông tin sản phẩm tại Vườn & Nắng.">
<!-- Google tag (gtag.js): chỉ tải trên website production. -->
<script>
  if (
    location.hostname === 'tony-jpham.github.io' &&
    location.pathname.startsWith('/vuon-va-nang/')
  ) {
    var gaScript = document.createElement('script');
    gaScript.async = true;
    gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-J0TFQ8QC6C';
    document.head.appendChild(gaScript);

    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){window.dataLayer.push(arguments);};
    window.gtag('js', new Date());
    window.gtag('config', 'G-J0TFQ8QC6C');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--green-deep:#1F2B1E;--green-mid:#3C4F35;--sage:#8A9B78;--kraft:#DDC9A3;--kraft-light:#EDE1C4;--rust:#A8442A;--rust-dim:#8B3A24;--ink:#241F17;--paper:#F6EFDD;--display:'Fraunces',serif;--body:'Work Sans',sans-serif;--mono:'Space Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-width:320px;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  img{display:block;max-width:100%;}
  .wrap{width:min(100% - 40px,1120px);margin:0 auto;}
  .site-header{border-bottom:1px solid rgba(36,31,23,.14);background:rgba(246,239,221,.95);}
  .site-header .wrap{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px;}
  .brand{font-family:var(--display);font-size:1.25rem;font-weight:600;text-decoration:none;color:var(--green-deep);white-space:nowrap;}
  .brand-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rust);margin-right:8px;}
  .back-link{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--green-mid);text-decoration:none;}
  .back-link:hover{color:var(--rust-dim);}
  main{padding:20px 0 72px;}
  .loading,.not-found{padding:64px 0;text-align:center;color:var(--green-mid);font-family:var(--mono);font-size:.9rem;}
  .breadcrumbs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;font-family:var(--mono);font-size:.7rem;color:var(--green-mid);}
  .breadcrumbs a{text-decoration:none;}.breadcrumbs a:hover{color:var(--rust-dim);}
  .product-layout{display:grid;gap:22px;}
  .product-image{height:min(50svh,438px);background:linear-gradient(135deg,var(--sage),var(--green-mid));border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .product-image img{width:auto;max-width:100%;height:100%;object-fit:contain;}
  .product-image .placeholder{font-size:3rem;opacity:.75;}
  .product-info{min-width:0;}
  .product-tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--rust);margin-bottom:10px;}
  h1{font-family:var(--display);font-size:clamp(2rem,9vw,3.7rem);font-weight:600;line-height:1.08;color:var(--green-deep);}
  .price{margin:12px 0 16px;color:var(--rust-dim);font-family:var(--mono);font-size:1.28rem;font-weight:700;}
  .description{color:var(--green-mid);font-size:1rem;}
  .share-action{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:0;border:0;background:transparent;color:var(--green-deep);font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;text-decoration:underline;text-decoration-color:var(--sage);text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer;}
  .share-action:hover{color:var(--rust-dim);}
  .benefit{margin-top:18px;padding:14px 16px;border-left:3px solid var(--sage);background:rgba(221,201,163,.38);font-size:.92rem;}
  .contact-card{margin-top:26px;padding:20px;background:var(--kraft-light);border:1px solid rgba(36,31,23,.14);border-radius:4px;}
  .contact-card h2,.product-extra h2,.related h2{font-family:var(--display);font-size:1.35rem;font-weight:600;color:var(--green-deep);}
  .contact-card p{margin-top:7px;color:var(--green-mid);font-size:.9rem;}
  .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px;}
  .button{min-height:48px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:2px;font-family:var(--mono);font-size:.75rem;letter-spacing:.04em;text-align:center;text-transform:uppercase;text-decoration:none;}
  .button-primary{background:var(--rust);color:var(--paper);}.button-primary:hover{background:var(--rust-dim);}
  .button-secondary{border:1px solid var(--green-deep);color:var(--green-deep);}.button-secondary:hover{background:var(--green-deep);color:var(--paper);}
  .product-extra{margin-top:28px;padding:22px 0;border-top:1px dashed rgba(36,31,23,.25);color:var(--green-mid);}
  .product-extra p{margin-top:8px;font-size:.92rem;}
  .related{margin-top:54px;padding-top:34px;border-top:1px solid rgba(36,31,23,.16);}
  .related-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px;}
  .related-head a{font-family:var(--mono);font-size:.72rem;color:var(--green-mid);text-decoration:none;white-space:nowrap;}
  .related-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  .related-card{display:grid;grid-template-columns:82px 1fr;gap:14px;min-height:100px;overflow:hidden;background:var(--kraft-light);border:1px solid rgba(36,31,23,.14);border-radius:3px;text-decoration:none;}
  .related-card img,.related-thumb{width:82px;height:100%;min-height:100px;object-fit:cover;background:var(--sage);}
  .related-thumb{display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
  .related-content{padding:13px 12px 13px 0;align-self:center;}
  .related-content h3{font-family:var(--display);font-size:1.05rem;font-weight:600;color:var(--green-deep);line-height:1.2;}
  .related-content p{margin-top:6px;color:var(--rust-dim);font-family:var(--mono);font-size:.76rem;font-weight:700;}
  .related-card:hover{border-color:var(--rust);}.related-card:hover h3{color:var(--rust-dim);}
  footer{padding:28px 0;background:var(--ink);color:var(--kraft);font-family:var(--mono);font-size:.72rem;}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}footer a{text-decoration:none;}
  @media (min-width:640px){.wrap{width:min(100% - 56px,1120px);}.actions{grid-template-columns:repeat(2,minmax(0,1fr));}.related-grid{grid-template-columns:repeat(3,minmax(0,1fr));}.related-card{grid-template-columns:1fr;}.related-card img,.related-thumb{width:100%;height:144px;min-height:0;}.related-content{padding:0 14px 16px;}.related-content h3{font-size:1.1rem;}}
  @media (min-width:860px){main{padding-top:42px;}.product-layout{grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:50px;align-items:start;}.product-image{height:min(70svh,620px);position:sticky;top:24px;}.related{margin-top:70px;}}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;}}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="brand-dot"></span>Vườn &amp; Nắng</a>
    <a class="back-link" href="index.html#san-pham">← Sản phẩm</a>
  </div>
</header>

<main class="wrap" id="product-detail" aria-live="polite">
  <p class="loading">Đang tải thông tin sản phẩm…</p>
</main>

<footer><div class="wrap"><span>© 2026 Vườn &amp; Nắng.</span><a href="index.html#lien-he">Liên hệ</a></div></footer>

<script>
(function () {
  var container = document.getElementById('product-detail');
  var productId = new URLSearchParams(window.location.search).get('id');

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
    });
  }

  function formatPrice(value) {
    return Number(value).toLocaleString('vi-VN') + 'đ';
  }

  function trackContact(event) {
    var link = event.target.closest('[data-contact-method]');
    if (!link || typeof window.gtag !== 'function') return;
    window.gtag('event', 'select_product_contact', {
      product_id: link.dataset.productId,
      product_name: link.dataset.productName,
      product_category: link.dataset.productCategory,
      contact_method: link.dataset.contactMethod
    });
  }

  function copyProductLink(event) {
    var button = event.target.closest('[data-copy-product-link]');
    if (!button) return;
    var link = window.location.href;
    var copiedLabel = 'Đã sao chép đường dẫn';

    function showCopied() {
      button.textContent = copiedLabel;
      window.setTimeout(function () { button.textContent = '↗ Sao chép đường dẫn sản phẩm'; }, 2200);
      if (typeof window.gtag === 'function') {
        window.gtag('event', 'share_product_link', {
          product_id: button.dataset.productId,
          product_name: button.dataset.productName,
          product_category: button.dataset.productCategory
        });
      }
    }

    function fallbackCopy() {
      var textArea = document.createElement('textarea');
      textArea.value = link;
      textArea.setAttribute('readonly', '');
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        if (document.execCommand('copy')) showCopied();
      } finally {
        document.body.removeChild(textArea);
      }
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(link).then(showCopied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  container.addEventListener('click', trackContact);
  container.addEventListener('click', copyProductLink);

  if (!productId) {
    container.innerHTML = '<div class="not-found">Không tìm thấy sản phẩm. <a href="index.html#san-pham">Quay lại danh sách sản phẩm</a>.</div>';
    return;
  }

  fetch('products.json')
    .then(function (response) {
      if (!response.ok) throw new Error('Không tải được dữ liệu sản phẩm');
      return response.json();
    })
    .then(function (data) {
      var products = data.products || [];
      var categories = data.categories || {};
      var product = products.find(function (item) { return item.id === productId; });
      if (!product) {
        container.innerHTML = '<div class="not-found">Sản phẩm này không còn tồn tại hoặc đường dẫn không đúng. <a href="index.html#san-pham">Quay lại danh sách sản phẩm</a>.</div>';
        return;
      }

      var category = categories[product.category] || { label: product.category, unit: '' };
      var unit = category.unit === 'Gói' ? 'Gói 100g' : (category.unit || '');
      var image = product.image
        ? '<img src="' + escapeHtml(product.image) + '" alt="' + escapeHtml(product.name) + '">'
        : '<span class="placeholder" role="img" aria-label="Chưa có ảnh sản phẩm">🌿</span>';
      var benefit = product.benefit ? '<p class="benefit">' + escapeHtml(product.benefit) + '</p>' : '';
      var related = products.filter(function (item) {
        return item.category === product.category && item.id !== product.id;
      }).slice(0, 3);
      var relatedHtml = related.length ? related.map(function (item) {
        var thumbnail = item.image
          ? '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.name) + '" loading="lazy">'
          : '<span class="related-thumb" aria-hidden="true">🌿</span>';
        return '<a class="related-card" href="san-pham.html?id=' + encodeURIComponent(item.id) + '">' + thumbnail + '<span class="related-content"><h3>' + escapeHtml(item.name) + '</h3><p>' + formatPrice(item.price) + '</p></span></a>';
      }).join('') : '<p class="description">Các sản phẩm khác sẽ được cập nhật thêm.</p>';
      var contactData = ' data-product-id="' + escapeHtml(product.id) + '" data-product-name="' + escapeHtml(product.name) + '" data-product-category="' + escapeHtml(category.label) + '"';

      container.innerHTML =
        '<nav class="breadcrumbs" aria-label="Điều hướng"><a href="index.html">Trang chủ</a><span>/</span><a href="index.html#san-pham">Sản phẩm</a><span>/</span><span>' + escapeHtml(category.label) + '</span></nav>' +
        '<article class="product-layout">' +
          '<div class="product-image">' + image + '</div>' +
          '<div class="product-info">' +
            '<p class="product-tag">' + escapeHtml(category.label) + (unit ? ' · ' + escapeHtml(unit) : '') + '</p>' +
            '<h1>' + escapeHtml(product.name) + '</h1>' +
            '<p class="price">' + formatPrice(product.price) + '</p>' +
            '<p class="description">' + escapeHtml(product.description || 'Liên hệ vườn để được tư vấn thêm về sản phẩm này.') + '</p>' + benefit +
            '<button type="button" class="share-action" aria-live="polite" data-copy-product-link' + contactData + '>↗ Sao chép đường dẫn sản phẩm</button>' +
            '<section class="contact-card" aria-label="Liên hệ đặt hàng"><h2>Đặt hàng &amp; tư vấn</h2><p>Liên hệ Vườn &amp; Nắng để kiểm tra tình trạng hàng và nhận tư vấn.</p>' +
              '<div class="actions">' +
                '<a class="button button-primary" href="https://zalo.me/0908097714" target="_blank" rel="noopener" data-contact-method="zalo"' + contactData + '>Chat qua Zalo</a>' +
                '<a class="button button-secondary" href="tel:+84908097714" data-contact-method="phone"' + contactData + '>Gọi 0908 097 714</a>' +
              '</div>' +
            '</section>' +
            '<section class="product-extra"><h2>Thông tin thêm</h2><p>Giá đã bao gồm đóng gói, chưa gồm phí giao hàng. Vui lòng liên hệ vườn để được tư vấn sản phẩm phù hợp và xác nhận tình trạng còn hàng.</p></section>' +
          '</div>' +
        '</article>' +
        '<section class="related" aria-labelledby="related-title"><div class="related-head"><h2 id="related-title">Sản phẩm cùng nhóm</h2><a href="index.html#san-pham">Xem tất cả →</a></div><div class="related-grid">' + relatedHtml + '</div></section>';

      document.title = product.name + ' — Vườn & Nắng';
      document.querySelector('meta[name="description"]').setAttribute('content', product.description || ('Thông tin sản phẩm ' + product.name + ' tại Vườn & Nắng.'));
      if (typeof window.gtag === 'function') {
        window.gtag('event', 'view_product_detail', {
          product_id: product.id,
          product_name: product.name,
          product_category: category.label,
          product_price: product.price,
          currency: 'VND'
        });
      }
    })
    .catch(function () {
      container.innerHTML = '<div class="not-found">Không tải được thông tin sản phẩm. Vui lòng thử lại sau hoặc <a href="index.html#san-pham">quay lại danh sách sản phẩm</a>.</div>';
    });
})();
</script>
</body>
</html>
